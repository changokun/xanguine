http {
	include mime.types;
	default_type application/octet-stream;
	sendfile on;
	keepalive_timeout 65;

	# Redirect www.xanguine.com to xanguine.com
	server {
		listen 80;
		server_name www.xanguine.com;
		return 301 https://xanguine.com$request_uri;
	}

	# Main server for xanguine.com
	server {
		listen 80;
		server_name xanguine.com;

		root /var/www/xanguine/dist;
		index index.html;

		# Handle SPA routing - serve index.html for all routes
		location / {
			try_files $uri $uri/ /index.html;
		}

		# Cache static assets
		location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
			expires 1y;
			add_header Cache-Control "public, immutable";
			try_files $uri =404;
		}
	}
}
