# Main server for xanguine.com
server {
	server_name xanguine.com;

	root /var/www/xanguine/dist;
	index index.html;

	# Redirect old /open-role to /careers
	location = /open-role {
		return 301 /careers;
	}

	# Handle SPA routing - serve index.html for all routes
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Cache static assets
	location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	listen 443 ssl; # managed by Certbot
	ssl_certificate /etc/letsencrypt/live/xanguine.com/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/xanguine.com/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
	if ($host = xanguine.com) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	listen 80;
	server_name xanguine.com;
	return 404; # managed by Certbot
}

server {
	if ($host = www.xanguine.com) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	listen 80;
	server_name www.xanguine.com;
	return 404; # managed by Certbot
}



# Redirect www.xanguine.com to xanguine.com
server {
	server_name www.xanguine.com;
	return 301 https://xanguine.com$request_uri;

	listen 443 ssl; # managed by Certbot
	ssl_certificate /etc/letsencrypt/live/xanguine.com/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/xanguine.com/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}